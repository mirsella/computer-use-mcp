name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy,rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential clang libclang-dev libdbus-1-dev libglib2.0-dev \
            libpipewire-0.3-dev libspa-0.2-dev libxkbcommon-dev pkg-config

      - name: Check Rust and guidance
        run: |
          cargo fmt --all -- --check
          bash scripts/check-guidance.sh
          cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
          cargo test --locked --workspace --all-features

      - name: Build npm tarball
        run: pnpm pack

      - name: Test the packed plugin and MCP executable
        run: |
          consumer=$(mktemp -d "$RUNNER_TEMP/computer-use-consumer.XXXXXX")
          printf '{"name":"package-consumer","private":true}\n' > "$consumer/package.json"
          pnpm --dir "$consumer" add "$GITHUB_WORKSPACE"/mirsella-computer-use-mcp-*.tgz @opencode-ai/plugin@1.18.11
          package="$consumer/node_modules/@mirsella/computer-use-mcp"
          COMPUTER_USE_MCP_PACKAGE_DIR="$package" pnpm test
          python3 -B -m unittest discover -s scripts -p 'test_model_smoke.py'
          ldd "$package/vendor/bin/computer-use-mcp"

      - name: Checksum release package
        run: sha256sum mirsella-computer-use-mcp-*.tgz > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: |
            mirsella-computer-use-mcp-*.tgz
            SHA256SUMS
          if-no-files-found: error
