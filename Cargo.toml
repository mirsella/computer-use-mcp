[workspace]
members = ["crates/computer-use-mcp"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mirsella/computer-use-mcp"

[workspace.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["remote_desktop", "screencast", "tokio"] }
atspi = { version = "=0.30.0", default-features = false }
atspi-proxies = { version = "=0.14.0", default-features = false }
base64 = "=0.22.1"
futures-util = "=0.3.32"
gio = { version = "=0.21.5", features = ["v2_58"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
pipewire = { version = "=0.10.0", features = ["v1_0_0"] }
reis = { version = "=0.7.0", default-features = false, features = ["tokio"] }
rmcp = { version = "=2.2.0", default-features = false, features = ["server", "transport-io"] }
rustix = { version = "=1.1.4", default-features = false, features = ["event", "fs", "time", "process"] }
serde_json = "=1.0.150"
tokio = { version = "=1.49.0", features = ["io-std", "io-util", "macros", "rt", "sync", "time", "process"] }
wayland-client = "=0.31.15"
wayland-backend = "=0.3.16"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "=0.3.12", features = ["client"] }
xkbcommon = { version = "=0.9.0", default-features = false }
zbus = { version = "=5.18.0", default-features = false, features = ["tokio"] }

[workspace.lints.rust]
unsafe_code = "forbid"
